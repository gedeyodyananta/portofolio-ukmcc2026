<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#080808"/>

  <!-- Dot grid -->
  <defs>
    <pattern id="dots" x="0" y="0" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="rgba(255,255,255,0.055)"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="black" stop-opacity="0"/>
      <stop offset="100%" stop-color="black" stop-opacity="0.85"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#vignette)"/>

  <!-- Eyebrow -->
  <text x="80" y="210"
        font-family="'Inter','Helvetica Neue',Arial,sans-serif"
        font-size="13" font-weight="600" letter-spacing="3.5"
        fill="rgba(255,255,255,0.35)">
    GEDE YODYANANTA  ·  FRONTEND DEVELOPER
  </text>

  <!-- Headline line 1 -->
  <text x="80" y="300"
        font-family="'Arial Black','Helvetica Neue',Arial,sans-serif"
        font-size="68" font-weight="800" letter-spacing="-2"
        fill="#ffffff">
    Building Intelligent
  </text>

  <!-- Headline line 2 — muted -->
  <text x="80" y="382"
        font-family="'Arial Black','Helvetica Neue',Arial,sans-serif"
        font-size="68" font-weight="800" letter-spacing="-2"
        fill="rgba(255,255,255,0.42)">
    Digital Experiences.
  </text>

  <!-- Sub text -->
  <text x="80" y="448"
        font-family="'Inter','Helvetica Neue',Arial,sans-serif"
        font-size="20" font-weight="400"
        fill="rgba(255,255,255,0.42)">
    Software Engineering Student · Politeknik Negeri Bali
  </text>

  <!-- URL pill -->
  <rect x="80" y="506" width="372" height="44" rx="22"
        fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="266" y="534"
        font-family="'Inter','Helvetica Neue',Arial,sans-serif"
        font-size="14" font-weight="500"
        fill="rgba(255,255,255,0.50)"
        text-anchor="middle">
    gedeyodyananta.vercel.app
  </text>
</svg>
